name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: "postgresql://fitcrew:fitcrew@localhost:5432/fitcrew?schema=public"

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitcrew
          POSTGRES_PASSWORD: fitcrew
          POSTGRES_DB: fitcrew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitcrew -d fitcrew"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Module boundary check
        run: pnpm boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Migration check
        run: pnpm migrate:check

      - name: Unit tests
        run: pnpm test
