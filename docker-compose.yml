services:
  postgres:
    image: postgres:16
    container_name: fitcrew-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitcrew
      POSTGRES_PASSWORD: fitcrew
      POSTGRES_DB: fitcrew
    ports:
      - "5432:5432"
    volumes:
      - fitcrew-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcrew -d fitcrew"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitcrew-postgres-data:
